server:
  listen_addr: "127.0.0.1:8443"
  admin_addr: "127.0.0.1:9090"
  read_timeout_ms: 5000
  max_body_bytes: 10485760 # 10 MB

upstream:
  default_target: "https://api.openai.com"
  routes:
    "/v1/messages": "https://api.anthropic.com"
    "/inference/": "https://api.fireworks.ai"
  timeout_ms: 60000

security:
  strict_mode: true # Fail-closed: return 502/403 if scanner panics or errors
  detokenize_responses: true # Restore tokens in LLM responses before returning to IDE
  vault_ttl_seconds: 900 # 15-minute ephemeral secret TTL
  entropy_threshold: 4.5 # Shannon entropy threshold for generic secret detection
  min_entropy_length: 20
  allowlist_patterns:
    - "^__TS_TOK_[a-f0-9]{8}__$"
    - "EXAMPLE_KEY_DO_NOT_USE"
  custom_rules:
    - id: "corp-internal-api"
      pattern: "CORP_[A-Z0-9]{24}"
      replacement_prefix: "CORP"

audit:
  enabled: true
  output_path: "./tracescrub-audit.jsonl"
  include_raw_secrets: false # Hard-enforced false; cannot be enabled in production
